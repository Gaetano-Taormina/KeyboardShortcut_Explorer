<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Shortcut Explorer</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>

    <div id="restart-disclaimer" class="hidden" style="background-color: var(--vscode-editorWarning-background, #cca700); color: var(--vscode-editorWarning-foreground, #000000); padding: 8px; text-align: center; position: relative; font-size: 12px; font-weight: bold; margin-bottom: 8px; border-radius: 4px;">
        <span>Structure updated! Please restart the window (Developer: Reload Window) to apply changes.</span>
        <button id="close-disclaimer" style="position: absolute; right: 4px; top: 4px; background: transparent; border: none; color: inherit; cursor: pointer; font-weight: bold; padding: 4px;">X</button>
    </div>
    <div class="search-container">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="Search (e.g. Save, Ctrl+S)..." />
            <button id="toggle-all-btn" class="toggle-all-btn" title="Expand/Collapse All">
                <!-- Folder Icon -->
                <svg id="folder-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M14.5 4h-6l-1-1H2.5l-.5.5v9l.5.5h12l.5-.5v-8l-.5-.5zM14 13H3V5h11v8z"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="shortcuts-container"></div>
    <div id="no-results" class="hidden">No shortcuts found.</div>
    
    <div id="custom-context-menu" class="hidden"></div>

    <script>
        // INJECTED_DATA will be replaced by the extension before serving the HTML
        const INJECTED_DATA = null;
        const INJECTED_SETTINGS = null;
        const INJECTED_HIDDEN_EXTENSIONS = null;
        const INJECTED_AVAILABLE_EXTENSIONS = null;
        const INJECTED_BUILTIN_EXTENSIONS = null;
        const INJECTED_PINNED_CATEGORIES = null;
        const INJECTED_CATEGORY_ORDER = null;
        const INJECTED_SHOW_DISCLAIMER = false;
        const INJECTED_VERSION = "1.0.2";
    </script>
    <script src="{{scriptUri}}"></script>
</body>
</html>
