name: Publish Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5'

permissions:
  contents: write # Necessario per creare commit, tag e Release su GitHub

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Recupera tutto lo storico (necessario per estrarre i commit dai tag)

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Auto-Release Script
        id: auto_release
        run: node scripts/auto-release.js

      - name: Push new Commit and Tag
        if: steps.auto_release.outputs.SHOULD_RELEASE == 'true'
        run: |
          git push origin main
          git push origin v${{ steps.auto_release.outputs.NEW_VERSION }}

      - name: Build Extension
        if: steps.auto_release.outputs.SHOULD_RELEASE == 'true'
        run: pnpm run build

      - name: Package Extension
        if: steps.auto_release.outputs.SHOULD_RELEASE == 'true'
        run: npx vsce package
        
      - name: Create GitHub Release
        if: steps.auto_release.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          name: "Release v${{ steps.auto_release.outputs.NEW_VERSION }}"
          tag_name: "v${{ steps.auto_release.outputs.NEW_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        run: npx vsce publish -p ${{ env.VSCE_PAT }}
        if: steps.auto_release.outputs.SHOULD_RELEASE == 'true' && env.VSCE_PAT != ''
